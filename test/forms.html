<!DOCTYPE html>
<html>
<head>
  <title>forms</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    h3 { color: navy; }
    label { display: inline; }
    p { margin: 10px 0; }
  </style>
</head>
<body>
  <h3>Login</h3>
  <form method="post" action="/login">
    <p>Username: <input type="text" name="user" value="claude" size="18"></p>
    <p>Password: <input type="password" name="pw" value="secret" size="18"></p>
    <p><input type="checkbox" name="remember" checked> Remember me</p>
    <p><input type="checkbox" name="news"> Subscribe to newsletter</p>
    <p>Plan:
      <input type="radio" name="plan" value="free" checked> Free
      <input type="radio" name="plan" value="pro"> Pro
      <input type="radio" name="plan" value="team"> Team
    </p>
    <p>
      <input type="submit" value="Log in">
      <input type="reset" value="Reset">
      <button type="button">Cancel</button>
    </p>
  </form>

  <h3>Other controls</h3>
  <p>Choose: <select><option>First</option><option>Second</option></select></p>
  <p>Notes:<br><textarea rows="3" cols="30">multi-line text area</textarea></p>
</body>
</html>
