<!DOCTYPE html>
<html>
<head>
  <title>forms</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    h3 { color: navy; }
    label { display: inline; }
    p { margin: 10px 0; }
  </style>
</head>
<body>
  <h3>Login</h3>
  <form>
    <p>Username: <input type="text" value="claude" size="18"></p>
    <p>Password: <input type="text" value="" size="18"></p>
    <p><input type="checkbox" checked> Remember me</p>
    <p><input type="checkbox"> Subscribe to newsletter</p>
    <p>
      <input type="submit" value="Log in">
      <button>Cancel</button>
    </p>
  </form>

  <h3>Other controls</h3>
  <p>Choose: <select><option>First</option><option>Second</option></select></p>
  <p>Notes:<br><textarea rows="3" cols="30">multi-line text area</textarea></p>
</body>
</html>
